name: Current research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-research-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-reader-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-notebooks.lock
      - name: Verify the separate current inventory
        run: python replication/verify_sources.py --manifest replication/current_source_manifest.json
      - name: Install the declared current environment
        run: |
          python -m pip install -r requirements.lock -r requirements-notebooks.lock
          python -m pip install -e . --no-deps
      - name: Require a native compiler
        run: g++ --version
      - name: Check the current reader package
        run: python scripts/reproduce_current_study.py --output data/private/reproduction/ci_current --with-native --compiler g++

  interval-arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-certification.lock
      - name: Verify the separate current inventory
        run: python replication/verify_sources.py --manifest replication/current_source_manifest.json
      - name: Install the separate interval environment
        run: python -m pip install -r requirements-certification.lock
      - name: Check finite-innovation and global residual enclosures
        run: |
          mkdir -p data/private
          python -m unittest discover -s tests -p test_certify_gain_replay.py -v
          python scripts/test_certified_residual.py
