name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interval-arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-certification.lock
      - name: Verify the published implementation inventory
        run: python projects/01_optimal_stopping/replication/verify_sources.py
      - name: Install the separate interval-arithmetic environment
        run: python -m pip install -r requirements-certification.lock
      - name: Check finite-innovation replay and global residual enclosures
        run: |
          mkdir -p data/private
          python -m unittest discover -s tests -p test_certify_gain_replay.py -v
          python scripts/test_certified_residual.py
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-notebooks.lock
      - name: Verify the published implementation inventory
        run: python projects/01_optimal_stopping/replication/verify_sources.py
      - name: Install frozen environment
        run: |
          python -m pip install -r requirements.lock -r requirements-notebooks.lock
          python -m pip install -e . --no-deps
      - name: Require compiler for native numerical checks
        run: c++ --version
      - name: Test numerical and data-ingestion code
        run: python -m pytest -q
      - name: Check documentation and retained source files
        run: python scripts/check_repository.py
      - name: Check released numerical summary tables
        run: |
          python projects/01_optimal_stopping/paper/verification/numerical_results.py
          python projects/01_optimal_stopping/paper/verification/paper_results.py
          python projects/01_optimal_stopping/paper/verification/cpu_timings.py
      - name: Check exact analytical fixtures
        run: python -m unittest discover -s projects/01_optimal_stopping/paper/verification -v
      - name: Audit Germany data coverage
        run: python scripts/audit_germany_data.py
      - name: Reproduce the public paper package
        run: python scripts/reproduce_paper.py --output data/private/reproduction/ci
      - name: Execute notebooks from fresh kernels
        run: python scripts/execute_notebooks.py
