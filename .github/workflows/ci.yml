name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-notebooks.lock
      - name: Install frozen environment
        run: |
          python -m pip install -r requirements.lock -r requirements-notebooks.lock
          python -m pip install -e . --no-deps
      - name: Test numerical and data-ingestion code
        run: python -m pytest -q
      - name: Check documentation and retained source files
        run: python scripts/check_repository.py
      - name: Audit Germany data coverage
        run: python scripts/audit_germany_data.py
      - name: Execute notebooks from fresh kernels
        run: python scripts/execute_notebooks.py
