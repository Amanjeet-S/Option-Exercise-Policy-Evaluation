[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qf-research"
version = "0.1.0"
description = "Reproducible research in quantitative finance and empirical economics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
notebooks = [
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
]

[project.urls]
Repository = "https://github.com/Amanjeet-S/Quantitative-Finance"

[project.scripts]
qf-benchmark = "qf_research.optimal_stopping.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
